<!-- Sports Logo SVG Patterns -->
<svg width="0" height="0" style="position: absolute;">
  <defs>
    <!-- Baseball Pattern -->
    <pattern id="baseball-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="100" cy="100" r="30" fill="none" stroke="rgba(59, 130, 246, 0.06)" stroke-width="2"/>
      <path d="M 80 100 Q 90 80, 100 80 Q 110 80, 120 100" fill="none" stroke="rgba(59, 130, 246, 0.06)" stroke-width="2"/>
      <path d="M 80 100 Q 90 120, 100 120 Q 110 120, 120 100" fill="none" stroke="rgba(59, 130, 246, 0.06)" stroke-width="2"/>
    </pattern>
    
    <!-- Basketball Pattern -->
    <pattern id="basketball-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="100" cy="100" r="30" fill="none" stroke="rgba(245, 158, 11, 0.06)" stroke-width="2"/>
      <line x1="70" y1="100" x2="130" y2="100" stroke="rgba(245, 158, 11, 0.06)" stroke-width="2"/>
      <line x1="100" y1="70" x2="100" y2="130" stroke="rgba(245, 158, 11, 0.06)" stroke-width="2"/>
    </pattern>
    
    <!-- Football Pattern -->
    <pattern id="football-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <ellipse cx="100" cy="100" rx="35" ry="25" fill="none" stroke="rgba(239, 68, 68, 0.06)" stroke-width="2"/>
      <line x1="100" y1="75" x2="100" y2="125" stroke="rgba(239, 68, 68, 0.06)" stroke-width="2"/>
    </pattern>
    
    <!-- Hockey Pattern -->
    <pattern id="hockey-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="100" cy="100" r="25" fill="none" stroke="rgba(139, 92, 246, 0.06)" stroke-width="2"/>
      <line x1="75" y1="85" x2="125" y2="115" stroke="rgba(139, 92, 246, 0.06)" stroke-width="3"/>
    </pattern>
    
    <!-- Soccer Pattern -->
    <pattern id="soccer-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="100" cy="100" r="30" fill="none" stroke="rgba(6, 182, 212, 0.06)" stroke-width="2"/>
      <polygon points="100,80 115,95 110,115 90,115 85,95" fill="none" stroke="rgba(6, 182, 212, 0.06)" stroke-width="2"/>
    </pattern>
    
    <!-- Cricket Pattern -->
    <pattern id="cricket-pattern" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
      <circle cx="100" cy="110" r="15" fill="none" stroke="rgba(16, 185, 129, 0.06)" stroke-width="2"/>
      <rect x="95" y="70" width="10" height="35" fill="none" stroke="rgba(16, 185, 129, 0.06)" stroke-width="2"/>
    </pattern>
  </defs>
</svg>

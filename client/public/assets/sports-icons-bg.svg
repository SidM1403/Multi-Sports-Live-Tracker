<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e5e7eb;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1920" height="1080" fill="url(#bgGradient)"/>
  
  <!-- Baseball icons -->
  <g opacity="0.15" fill="none" stroke="#3b82f6" stroke-width="3">
    <circle cx="300" cy="200" r="40"/>
    <path d="M 270 200 Q 285 170, 300 170 Q 315 170, 330 200"/>
    <path d="M 270 200 Q 285 230, 300 230 Q 315 230, 330 200"/>
  </g>
  
  <g opacity="0.12" fill="none" stroke="#3b82f6" stroke-width="3">
    <circle cx="1600" cy="800" r="35"/>
    <path d="M 1575 800 Q 1587 775, 1600 775 Q 1613 775, 1625 800"/>
    <path d="M 1575 800 Q 1587 825, 1600 825 Q 1613 825, 1625 800"/>
  </g>
  
  <!-- Basketball icons -->
  <g opacity="0.15" fill="none" stroke="#f59e0b" stroke-width="3">
    <circle cx="1500" cy="250" r="45"/>
    <line x1="1455" y1="250" x2="1545" y2="250"/>
    <line x1="1500" y1="205" x2="1500" y2="295"/>
    <path d="M 1500 205 Q 1530 250, 1500 295"/>
    <path d="M 1500 205 Q 1470 250, 1500 295"/>
  </g>
  
  <g opacity="0.13" fill="none" stroke="#f59e0b" stroke-width="3">
    <circle cx="400" cy="850" r="40"/>
    <line x1="360" y1="850" x2="440" y2="850"/>
    <line x1="400" y1="810" x2="400" y2="890"/>
  </g>
  
  <!-- Football icons -->
  <g opacity="0.15" fill="none" stroke="#ef4444" stroke-width="3">
    <ellipse cx="800" cy="300" rx="50" ry="35"/>
    <line x1="800" y1="265" x2="800" y2="335"/>
    <line x1="790" y1="300" x2="810" y2="300"/>
  </g>
  
  <g opacity="0.14" fill="none" stroke="#ef4444" stroke-width="3">
    <ellipse cx="1200" cy="900" rx="45" ry="30"/>
    <line x1="1200" y1="870" x2="1200" y2="930"/>
  </g>
  
  <!-- Soccer ball icons -->
  <g opacity="0.15" fill="none" stroke="#06b6d4" stroke-width="3">
    <circle cx="600" cy="600" r="45"/>
    <polygon points="600,565 615,585 607,610 593,610 585,585" stroke="#06b6d4" fill="none"/>
  </g>
  
  <g opacity="0.13" fill="none" stroke="#06b6d4" stroke-width="3">
    <circle cx="1700" cy="500" r="40"/>
    <polygon points="1700,470 1712,487 1705,508 1695,508 1688,487" stroke="#06b6d4" fill="none"/>
  </g>
  
  <!-- Hockey puck and stick -->
  <g opacity="0.15" stroke="#8b5cf6" stroke-width="3" fill="none">
    <ellipse cx="1100" cy="200" rx="30" ry="15"/>
    <path d="M 1050 180 Q 1070 170, 1090 180" stroke-width="5" stroke-linecap="round"/>
  </g>
  
  <g opacity="0.14" stroke="#8b5cf6" stroke-width="3" fill="none">
    <ellipse cx="250" cy="500" rx="25" ry="12"/>
    <path d="M 210 485 Q 225 478, 240 485" stroke-width="4" stroke-linecap="round"/>
  </g>
  
  <!-- Cricket bat and ball -->
  <g opacity="0.15" stroke="#10b981" stroke-width="3" fill="none">
    <circle cx="950" cy="750" r="20"/>
    <rect x="915" y="680" width="15" height="60" rx="3"/>
  </g>
  
  <g opacity="0.13" stroke="#10b981" stroke-width="3" fill="none">
    <circle cx="1400" cy="650" r="18"/>
    <rect x="1370" y="590" width="12" height="50" rx="2"/>
  </g>
  
  <!-- Additional scattered small icons -->
  <circle cx="500" cy="450" r="25" opacity="0.08" fill="#3b82f6"/>
  <circle cx="1300" cy="400" r="20" opacity="0.08" fill="#f59e0b"/>
  <circle cx="700" cy="900" r="22" opacity="0.08" fill="#ef4444"/>
  <circle cx="1550" cy="950" r="18" opacity="0.08" fill="#06b6d4"/>
  <circle cx="350" cy="750" r="20" opacity="0.08" fill="#8b5cf6"/>
  <circle cx="1050" cy="500" r="24" opacity="0.08" fill="#10b981"/>
</svg>

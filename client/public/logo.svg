<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient matching website colors -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    
    <!-- Subtle shadow -->
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGrad)" filter="url(#softShadow)"/>
  
  <!-- SJ Letters - Modern, clean design -->
  <g fill="#ffffff" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700">
    <!-- S Letter -->
    <text x="55" y="130" font-size="85" letter-spacing="-2">S</text>
    
    <!-- J Letter -->
    <text x="110" y="130" font-size="85" letter-spacing="-2">J</text>
  </g>
  
  <!-- Subtle accent ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.25"/>
</svg>
